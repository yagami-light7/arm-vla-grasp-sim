manual_path_publisher:
  ros__parameters:
    use_sim_time: true
    topic: /initial_path
    frame_id: world

    # 标准 Go2 + MoE-CTS 的真实 0.30 m 踏面 A/B 路径。
    # IsaacLab HfTerrain 使用 horizontal_scale=0.10 m，并按
    # int(step_width / horizontal_scale) 离散；Isaac 端必须传
    # --stair-width=0.31，才能得到 3 个栅格、即实际 0.30 m 踏面。
    #
    # 固定 8 m 子地形在该踏面下形成 9 次 0.19 m 抬升，中央低平台地面
    # 为 -1.71 m。这里发布的是地面高度，绝不重复添加 body_height。
    points_xyz:
      # 中央低平台接近段；首个立面位于 x=1.30 m。
      - -0.05
      - 0.02
      - -1.71
      - 0.35
      - 0.02
      - -1.71
      - 0.75
      - 0.02
      - -1.71
      - 1.00
      - 0.02
      - -1.71
      - 1.20
      - 0.02
      - -1.71
      - 1.29
      - 0.02
      - -1.71

      # 第 1～8 级中间踏面；每个边缘保留 0.01 m 裕量。
      - 1.31
      - 0.02
      - -1.52
      - 1.59
      - 0.02
      - -1.52
      - 1.61
      - 0.02
      - -1.33
      - 1.89
      - 0.02
      - -1.33
      - 1.91
      - 0.02
      - -1.14
      - 2.19
      - 0.02
      - -1.14
      - 2.21
      - 0.02
      - -0.95
      - 2.49
      - 0.02
      - -0.95
      - 2.51
      - 0.02
      - -0.76
      - 2.79
      - 0.02
      - -0.76
      - 2.81
      - 0.02
      - -0.57
      - 3.09
      - 0.02
      - -0.57
      - 3.11
      - 0.02
      - -0.38
      - 3.39
      - 0.02
      - -0.38
      - 3.41
      - 0.02
      - -0.19
      - 3.69
      - 0.02
      - -0.19

      # 第 9 次抬升后进入外侧 z=0 平台。
      - 3.71
      - 0.02
      - 0.0
      - 4.05
      - 0.02
      - 0.0
      - 4.40
      - 0.02
      - 0.0

    min_point_distance_m: 0.02
    startup_delay_sec: 1.0

    # 这是标准 Go2 policy 的纯物理 A/B，不使用 Go2-X5 root-lock。
    scan_stair_freeze_stair_segment_indices: [-1, -1]
