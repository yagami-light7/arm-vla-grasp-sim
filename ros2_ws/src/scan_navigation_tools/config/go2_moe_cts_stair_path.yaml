manual_path_publisher:
  ros__parameters:
    use_sim_time: true
    topic: /initial_path
    frame_id: world

    # 标准 Go2 + MoE-CTS 确定性倒金字塔楼梯的单跑完整路径。
    # 每三个数依次为 world 坐标系中的 x、y、地面高度 z；这里绝不添加
    # body_height，SCAN 与 controller 只在各自入口使用同一 0.342 m 合同。
    #
    # 这份几何绑定当前已实测的 Isaac 高度场：低平台 z=-2.47 m，第一处
    # 抬升位于 x≈1.40 m，每级 0.19 m。当前 HfTerrain horizontal_scale
    # 为 0.10 m，而 --stair-width=0.30 在上游 int() 离散后实际占 2 个
    # 栅格，即 0.20 m。每一级都用踏面首尾两个点描述，避免把水平支撑面
    # 误近似成连续斜坡并污染 SCAN 占据地图。
    points_xyz:
      # 低平台接近段。
      - -0.05
      - 0.02
      - -2.47
      - 0.35
      - 0.02
      - -2.47
      - 0.75
      - 0.02
      - -2.47
      - 1.10
      - 0.02
      - -2.47
      - 1.30
      - 0.02
      - -2.47
      - 1.39
      - 0.02
      - -2.47

      # 第 1～12 级踏面；边缘各留 0.01 m，避免恰落在垂直面上。
      - 1.41
      - 0.02
      - -2.28
      - 1.59
      - 0.02
      - -2.28
      - 1.61
      - 0.02
      - -2.09
      - 1.79
      - 0.02
      - -2.09
      - 1.81
      - 0.02
      - -1.90
      - 1.99
      - 0.02
      - -1.90
      - 2.01
      - 0.02
      - -1.71
      - 2.19
      - 0.02
      - -1.71
      - 2.21
      - 0.02
      - -1.52
      - 2.39
      - 0.02
      - -1.52
      - 2.41
      - 0.02
      - -1.33
      - 2.59
      - 0.02
      - -1.33
      - 2.61
      - 0.02
      - -1.14
      - 2.79
      - 0.02
      - -1.14
      - 2.81
      - 0.02
      - -0.95
      - 2.99
      - 0.02
      - -0.95
      - 3.01
      - 0.02
      - -0.76
      - 3.19
      - 0.02
      - -0.76
      - 3.21
      - 0.02
      - -0.57
      - 3.39
      - 0.02
      - -0.57
      - 3.41
      - 0.02
      - -0.38
      - 3.59
      - 0.02
      - -0.38
      - 3.61
      - 0.02
      - -0.19
      - 3.79
      - 0.02
      - -0.19

      # 第 13 次抬升后进入外侧 z=0 平台，并保留足够终点驻留距离。
      - 3.81
      - 0.02
      - 0.0
      - 4.10
      - 0.02
      - 0.0
      - 4.40
      - 0.02
      - 0.0

    min_point_distance_m: 0.02
    startup_delay_sec: 1.0

    # 标准 Go2 支线必须始终发布 frozen=false；[-1,-1] 明确表示不使用
    # Go2-X5 的 root-lock 楼梯冻结 workaround。
    scan_stair_freeze_stair_segment_indices: [-1, -1]
